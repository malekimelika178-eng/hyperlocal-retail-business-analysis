<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#f7f9fc"/><text x="700" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">Multi-Retailer Order Fulfillment Process</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#526d82"/></marker></defs><rect x="40" y="140" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="150" y="178" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Customer</text><text x="150" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Search + one checkout</text><rect x="310" y="140" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="420" y="178" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Platform</text><text x="420" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Validate address + fees</text><rect x="580" y="140" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="690" y="178" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Retailers</text><text x="690" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Confirm inventory</text><rect x="850" y="140" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="960" y="178" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Store staff</text><text x="960" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Prepare + label packages</text><rect x="1120" y="140" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="1230" y="178" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Dispatch</text><text x="1230" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Create partner offer</text><rect x="1120" y="410" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="1230" y="448" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Partner</text><text x="1230" y="478" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Accept / decline offer</text><rect x="850" y="410" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="960" y="448" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Pickup</text><text x="960" y="478" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Collect ready packages</text><rect x="580" y="410" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="690" y="448" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Delivery</text><text x="690" y="478" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Deliver + proof</text><rect x="310" y="410" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="420" y="448" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Settlement</text><text x="420" y="478" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Partner + retailer payments</text><rect x="40" y="410" width="220" height="100" rx="12" fill="white" stroke="#35658a" stroke-width="3"/><text x="150" y="448" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#17324d">Support</text><text x="150" y="478" text-anchor="middle" font-family="Arial" font-size="13" fill="#486581">Refunds + exceptions</text><path d="M260 190 L310 190" stroke="#526d